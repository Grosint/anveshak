---
# Anveshak — AI-OSINT Platform
# Docker Compose v3.9 — primary stack
# Usage:
#   docker compose -f infra/compose.yml up
#   docker compose -f infra/compose.yml -f infra/compose.vision.yml up
#   docker compose -f infra/compose.yml -f infra/compose.bridge.yml up

x-common-env: &common-env
  POSTGRES_URL: postgresql://anveshak:${POSTGRES_PASSWORD}@postgres:5432/anveshak
  REDIS_URL: redis://redis:6379/0
  OLLAMA_BASE_URL: http://ollama:11434
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-production}

x-vision-env: &vision-env
  <<: *common-env
  VISION_DEVICE: ${VISION_DEVICE:-cpu}
  MODEL_DIR: /app/models
  MEDIA_STORAGE_ROOT: /app/media
  YOLO_MODEL_SIZE: ${YOLO_MODEL_SIZE:-nano}
  CLIP_MODEL_NAME: ${CLIP_MODEL_NAME:-openai/clip-vit-base-patch32}
  VISION_DEEPFAKE_IMAGE_MODEL: ${VISION_DEEPFAKE_IMAGE_MODEL:-facetorch}
  VISION_DEEPFAKE_VIDEO_MODEL: ${VISION_DEEPFAKE_VIDEO_MODEL:-efficientnet}
  VISION_BATCH_SIZE: ${VISION_BATCH_SIZE:-1}
  PHASH_DUPLICATE_THRESHOLD: ${PHASH_DUPLICATE_THRESHOLD:-8}
  VIDEO_KEYFRAME_INTERVAL_S: ${VIDEO_KEYFRAME_INTERVAL_S:-5}
  VISION_MAX_VIDEO_SIZE_MB: ${VISION_MAX_VIDEO_SIZE_MB:-500}
  EXIF_BACKEND: ${EXIF_BACKEND:-pillow}
  FACETORCH_HF_MODEL: ${FACETORCH_HF_MODEL:-prithivMLmods/Deep-Fake-Detector-v2-Model}
  EFFICIENTNET_HF_MODEL: ${EFFICIENTNET_HF_MODEL:-umm-maybe/AI-image-detector}
  MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 30s

services:

  # ---------------------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------------------

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: anveshak
      POSTGRES_USER: anveshak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anveshak -d anveshak"]
      <<: *healthcheck-defaults
    networks:
      - anveshak-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: >
      redis-server
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-defaults
    networks:
      - anveshak-net

  # Tor SOCKS5 proxy — dark web (.onion) scraping via scraper service
  tor-proxy:
    image: alpine:3.20
    restart: unless-stopped
    mem_limit: 128m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache tor &&
        echo "SocksPort 0.0.0.0:9050" > /etc/tor/torrc &&
        echo "SocksPolicy accept 172.28.0.0/16" >> /etc/tor/torrc &&
        echo "SocksPolicy reject *" >> /etc/tor/torrc &&
        tor -f /etc/tor/torrc
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      <<: *healthcheck-defaults
      start_period: 45s
    networks:
      - anveshak-net

  # ---------------------------------------------------------------------------
  # Inference
  # ---------------------------------------------------------------------------

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 8g
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - anveshak-net

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------

  api:
    image: anveshak-api:latest
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    environment:
      <<: *common-env
      API_SECRET_KEY: ${API_SECRET_KEY}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:3000}
      SCRAPER_SERVICE_URL: http://scraper:8001
      SOCIAL_SERVICE_URL: http://social:8002
      ANALYST_SERVICE_URL: http://analyst-scheduler:8007
      REPORTER_SERVICE_URL: http://reporter:8005
      VISION_SERVICE_URL: http://vision:8003
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - anveshak-net

  scraper:
    image: anveshak-scraper:latest
    build:
      context: ..
      dockerfile: services/scraper/Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    environment:
      <<: *common-env
      SCRAPER_PORT: 8001
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      SCRAPER_CONCURRENCY: ${SCRAPER_CONCURRENCY:-4}
      SCRAPER_REQUEST_TIMEOUT_S: ${SCRAPER_REQUEST_TIMEOUT_S:-30}
      TOR_PROXY_URL: ${TOR_PROXY_URL:-}
      DARKWEB_TOR_PROXY_URL: ${DARKWEB_TOR_PROXY_URL:-socks5://tor-proxy:9050}
      DARKWEB_REQUEST_TIMEOUT_S: ${DARKWEB_REQUEST_TIMEOUT_S:-90}
      DARKWEB_CONCURRENCY: ${DARKWEB_CONCURRENCY:-2}
      MEDIA_STORAGE_ROOT: /app/media
      MEDIA_MAX_SIZE_MB: ${MEDIA_MAX_SIZE_MB:-50}
      MEDIA_DOWNLOAD_ENABLED: "true"
    volumes:
      - vision_media:/app/media
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tor-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - anveshak-net

  # ARQ worker for scrape_topic, poll_rss_sources, scrape_darkweb_topic, check_all_source_health jobs
  scraper-worker:
    image: anveshak-scraper:latest
    restart: unless-stopped
    mem_limit: 1g
    environment:
      <<: *common-env
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      SCRAPER_CONCURRENCY: ${SCRAPER_CONCURRENCY:-4}
      SCRAPER_REQUEST_TIMEOUT_S: ${SCRAPER_REQUEST_TIMEOUT_S:-30}
      TOR_PROXY_URL: ${TOR_PROXY_URL:-}
      DARKWEB_TOR_PROXY_URL: ${DARKWEB_TOR_PROXY_URL:-socks5://tor-proxy:9050}
      DARKWEB_REQUEST_TIMEOUT_S: ${DARKWEB_REQUEST_TIMEOUT_S:-90}
      DARKWEB_CONCURRENCY: ${DARKWEB_CONCURRENCY:-2}
      MEDIA_STORAGE_ROOT: /app/media
      MEDIA_MAX_SIZE_MB: ${MEDIA_MAX_SIZE_MB:-50}
      MEDIA_DOWNLOAD_ENABLED: "true"
      HOME: /tmp
    volumes:
      - vision_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tor-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import arq; import anveshak.scraper.jobs'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - anveshak-net
    command: ["python", "-m", "arq", "anveshak.scraper.jobs.WorkerSettings"]

  social:
    image: anveshak-social:latest
    build:
      context: ..
      dockerfile: services/social/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *common-env
      SOCIAL_PORT: 8002
      TELEGRAM_ADAPTER_ENABLED: ${TELEGRAM_ADAPTER_ENABLED:-false}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      X_ADAPTER_ENABLED: ${X_ADAPTER_ENABLED:-false}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      X_MONTHLY_READ_CAP: ${X_MONTHLY_READ_CAP:-40000}
      X_POLL_INTERVAL_S: ${X_POLL_INTERVAL_S:-900}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-Anveshak OSINT Platform/1.0}
      REDDIT_ADAPTER_ENABLED: ${REDDIT_ADAPTER_ENABLED:-false}
      BLUESKY_HANDLE: ${BLUESKY_HANDLE:-}
      BLUESKY_PASSWORD: ${BLUESKY_PASSWORD:-}
      BLUESKY_ADAPTER_ENABLED: ${BLUESKY_ADAPTER_ENABLED:-false}
      X_ADAPTER_MODE: ${X_ADAPTER_MODE:-polling}
      POLL_INTERVAL_S: ${POLL_INTERVAL_S:-900}
      METRICS_PORT: ${METRICS_PORT:-8002}
      SOCIAL_RATE_LIMIT_RPM: ${SOCIAL_RATE_LIMIT_RPM:-60}
      MEDIA_STORAGE_ROOT: /app/media
      MEDIA_MAX_SIZE_MB: ${MEDIA_MAX_SIZE_MB:-50}
    volumes:
      - vision_media:/app/media
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - anveshak-net

  # Analyst is split into scheduler (lightweight loops) + worker (ARQ ML pipeline).
  # Scheduler: clustering, signals, convergence, orphan sweep — 512 MB, no ML models.
  # Worker: NLP, embedding, label gen, credibility — 6 GB, horizontally scalable.
  # Init: downloads ML models to shared volume on first run (NLLB, sentence-transformers).

  analyst-init:
    image: anveshak-analyst:latest
    command: ["python", "-m", "anveshak.analyst.download_models"]
    environment:
      <<: *common-env
      TRANSLATION_ENABLED: ${TRANSLATION_ENABLED:-true}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-facebook/nllb-200-distilled-600M}
      HF_HOME: /app/models
    volumes:
      - analyst_models:/app/models
    restart: "no"
    networks:
      - anveshak-net

  analyst-scheduler:
    image: anveshak-analyst:latest
    build:
      context: ..
      dockerfile: services/analyst/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    command: ["python", "-m", "anveshak.analyst.scheduler"]
    environment:
      <<: *common-env
      ANALYST_PORT: 8007
      METRICS_PORT: 8007
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2:7b}
      CLUSTERING_SIMILARITY_THRESHOLD: ${CLUSTERING_SIMILARITY_THRESHOLD:-0.70}
      CLUSTERING_MIN_CLUSTER_SIZE: ${CLUSTERING_MIN_CLUSTER_SIZE:-2}
      TOPIC_RELEVANCE_THRESHOLD: ${TOPIC_RELEVANCE_THRESHOLD:-0.35}
      CLUSTER_ASSIGN_THRESHOLD: ${CLUSTER_ASSIGN_THRESHOLD:-0.70}
      ENTITY_BLEND_WEIGHT: ${ENTITY_BLEND_WEIGHT:-0.3}
      CONTENT_RETENTION_DAYS: ${CONTENT_RETENTION_DAYS:-0}
      CONTENT_ARCHIVE_ROOT: ${CONTENT_ARCHIVE_ROOT:-/app/media/archive}
      MAX_TOPICS_PER_CYCLE: ${MAX_TOPICS_PER_CYCLE:-0}
      HF_HOME: /app/models
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8007/health || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - anveshak-net

  analyst-worker:
    image: anveshak-analyst:latest
    restart: unless-stopped
    mem_limit: 6g
    command: ["python", "-m", "arq", "anveshak.analyst.jobs.WorkerSettings"]
    environment:
      <<: *common-env
      SPACY_EN_MODEL: ${SPACY_EN_MODEL:-en_core_web_md}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2:7b}
      TRANSLATION_ENABLED: ${TRANSLATION_ENABLED:-true}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-facebook/nllb-200-distilled-600M}
      TRANSLATION_MAX_CHARS: ${TRANSLATION_MAX_CHARS:-1500}
      TRANSLATION_MAX_TOKENS: ${TRANSLATION_MAX_TOKENS:-512}
      NER_CONFIDENCE_THRESHOLD: ${NER_CONFIDENCE_THRESHOLD:-0.75}
      ENTITY_SIMILARITY_THRESHOLD: ${ENTITY_SIMILARITY_THRESHOLD:-0.85}
      CLUSTERING_SIMILARITY_THRESHOLD: ${CLUSTERING_SIMILARITY_THRESHOLD:-0.70}
      CLUSTERING_MIN_CLUSTER_SIZE: ${CLUSTERING_MIN_CLUSTER_SIZE:-2}
      TOPIC_RELEVANCE_THRESHOLD: ${TOPIC_RELEVANCE_THRESHOLD:-0.35}
      CLUSTER_ASSIGN_THRESHOLD: ${CLUSTER_ASSIGN_THRESHOLD:-0.70}
      ENTITY_BLEND_WEIGHT: ${ENTITY_BLEND_WEIGHT:-0.3}
      HF_HOME: /app/models
    volumes:
      - analyst_models:/app/models
    deploy:
      replicas: ${ANALYST_WORKER_REPLICAS:-1}
    depends_on:
      analyst-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      <<: *healthcheck-defaults
      start_period: 120s
    networks:
      - anveshak-net

  reporter:
    image: anveshak-reporter:latest
    build:
      context: ..
      dockerfile: services/reporter/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *common-env
      REPORTER_PORT: 8005
      REPORT_OUTPUT_DIR: /app/reports
      REPORT_TEMPLATE_DIR: /app/templates
      ANALYST_SERVICE_URL: http://analyst-scheduler:8007
    volumes:
      - reporter_output:/app/reports
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8005/health || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - anveshak-net

  # ARQ worker for generate_report jobs — separate process from FastAPI
  # Handles RAG retrieval, Ollama LLM calls, geocoding, and DB writes
  reporter-worker:
    image: anveshak-reporter:latest
    restart: unless-stopped
    mem_limit: 1g
    environment:
      <<: *common-env
      REPORT_OUTPUT_DIR: /app/reports
      REPORT_TEMPLATE_DIR: /app/templates
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2:7b}
      ANALYST_SERVICE_URL: http://analyst-scheduler:8007
      OLLAMA_REPORT_TIMEOUT_S: ${OLLAMA_REPORT_TIMEOUT_S:-540}
      METRICS_PORT: 8006
    volumes:
      - reporter_output:/app/reports
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import arq; import anveshak.reporter.worker'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - anveshak-net
    command: ["python", "-m", "arq", "anveshak.reporter.worker.WorkerSettings"]

  # ---------------------------------------------------------------------------
  # Vision (M4: YOLO, CLIP, deepfake, EXIF, pHash)
  # ---------------------------------------------------------------------------

  # Vision model init — downloads YOLO, CLIP, facetorch, efficientnet to shared volume.
  # Runs once on first deploy, idempotent on restarts.
  vision-init:
    image: anveshak-vision:latest
    command: ["python", "-m", "anveshak.vision.download_models"]
    environment:
      <<: *vision-env
      HF_HOME: /app/models
    volumes:
      - vision_models:/app/models
    restart: "no"
    networks:
      - anveshak-net

  vision:
    image: anveshak-vision:latest
    build:
      context: ..
      dockerfile: services/vision/Dockerfile
    restart: unless-stopped
    mem_limit: 4g
    environment:
      <<: *vision-env
      PORT: 8003
      HF_HOME: /app/models
    volumes:
      - vision_models:/app/models
      - vision_media:/app/media
    ports:
      - "8003:8003"
    depends_on:
      vision-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - anveshak-net

  # ARQ worker for vision analysis jobs (run_vision_analysis)
  # Separate process from FastAPI so uploads don't block ML inference
  vision-worker:
    image: anveshak-vision:latest
    restart: unless-stopped
    mem_limit: 6g
    environment:
      <<: *vision-env
      HF_HOME: /app/models
    volumes:
      - vision_models:/app/models
      - vision_media:/app/media
    depends_on:
      vision-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import arq; import anveshak.vision.jobs'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - anveshak-net
    command: ["python", "-m", "arq", "anveshak.vision.jobs.WorkerSettings"]

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NGINX_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - anveshak-net

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Log aggregation: Loki (backend) + Promtail (shipper)
  # ---------------------------------------------------------------------------

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    mem_limit: 512m
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./configs/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - anveshak-net

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    mem_limit: 128m
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./configs/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      # Read-only Docker socket — Promtail reads container logs, never writes
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host log positions file (persists scrape offsets across restarts)
      - promtail_positions:/tmp
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - anveshak-net

  # ---------------------------------------------------------------------------
  # Database/cache exporters for Prometheus
  # ---------------------------------------------------------------------------

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DATA_SOURCE_NAME: "postgresql://anveshak:${POSTGRES_PASSWORD}@postgres:5432/anveshak?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics | head -1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - anveshak-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    mem_limit: 64m
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - anveshak-net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    mem_limit: 512m
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - anveshak-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_HTTP_PORT: 3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ${GRAFANA_PLUGINS:-}
      # Enable unified alerting (Grafana managed alerts)
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      # Feature toggles for Loki log panels
      GF_FEATURE_TOGGLES_ENABLE: "lokiLive"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./configs/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - anveshak-net

  # ---------------------------------------------------------------------------
  # Container resource monitoring (CPU, memory, network, disk per container)
  # ---------------------------------------------------------------------------

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: anveshak-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - anveshak-net

  # ---------------------------------------------------------------------------
  # Distributed tracing (opt-in via OTEL_ENABLED=true)
  # ---------------------------------------------------------------------------

  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP receiver
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16687/ || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - anveshak-net
    profiles:
      - tracing           # Only starts with: docker compose --profile tracing up

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------

networks:
  anveshak-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_models:
    driver: local
  reporter_output:
    driver: local
  analyst_models:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  promtail_positions:
    driver: local
  vision_models:
    driver: local
  vision_media:
    driver: local
