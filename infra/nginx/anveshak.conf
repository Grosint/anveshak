# Anveshak — Host nginx TLS termination config
# Deploy to: /etc/nginx/sites-available/anveshak
# Symlink: ln -s /etc/nginx/sites-available/anveshak /etc/nginx/sites-enabled/
# Certbot will modify ssl_certificate paths after initial run.

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/s;

# HTTP → HTTPS redirect + Let's Encrypt ACME challenge
server {
    listen 80;
    server_name anveshak.grosint.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS termination → Docker frontend (port 3000)
server {
    listen 443 ssl http2;
    server_name anveshak.grosint.in;

    # --- TLS Configuration ---
    # Certbot will populate these paths after first run.
    # Until then, comment out the ssl_certificate lines and use HTTP only.
    ssl_certificate /etc/letsencrypt/live/anveshak.grosint.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anveshak.grosint.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Body size (media uploads up to 100 MB) ---
    client_max_body_size 100m;

    # --- Timeouts ---
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # --- Proxy headers ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Auth endpoints: strict rate limit ---
    location /api/v1/auth/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # --- WebSocket (signal notifications) ---
    location /api/v1/signals/ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- REST API with rate limiting ---
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # --- Frontend (SPA + static assets) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    # --- Block dotfiles ---
    location ~ /\. {
        deny all;
        return 404;
    }

    # --- Health check for external monitoring ---
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Logging ---
    access_log /var/log/nginx/anveshak_access.log combined buffer=16k flush=5s;
    error_log /var/log/nginx/anveshak_error.log warn;

    server_tokens off;
}
