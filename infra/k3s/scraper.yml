apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrape-web-scheduler
  namespace: anveshak
  labels:
    app: scrape-web-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrape-web-scheduler
  template:
    metadata:
      labels:
        app: scrape-web-scheduler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: scrape-web-scheduler
          image: anveshak-scraper:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anveshak-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_URL
              value: "postgresql://anveshak:$(POSTGRES_PASSWORD)@postgres:5432/anveshak"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MEDIA_STORAGE_ROOT
              value: "/app/media"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 768Mi
          volumeMounts:
            - name: media
              mountPath: /app/media
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: vision-media-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrape-web-worker
  namespace: anveshak
  labels:
    app: scrape-web-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrape-web-worker
  template:
    metadata:
      labels:
        app: scrape-web-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: scrape-web-worker
          image: anveshak-scraper:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "arq", "anveshak.scraper.jobs.WorkerSettings"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anveshak-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_URL
              value: "postgresql://anveshak:$(POSTGRES_PASSWORD)@postgres:5432/anveshak"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MEDIA_STORAGE_ROOT
              value: "/app/media"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["python", "-c", "import redis; redis.from_url('redis://redis:6379/0').ping()"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          volumeMounts:
            - name: media
              mountPath: /app/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: vision-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: scrape-web-scheduler
  namespace: anveshak
spec:
  selector:
    app: scrape-web-scheduler
  ports:
    - port: 8001
      targetPort: 8001
