# Vision FastAPI container eliminated — file upload absorbed into API gateway.
# Only the ARQ worker remains for ML inference (YOLO, CLIP, deepfake).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyse-vision-worker
  namespace: anveshak
  labels:
    app: analyse-vision-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyse-vision-worker
  template:
    metadata:
      labels:
        app: analyse-vision-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: analyse-vision-worker
          image: anveshak-vision:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "arq", "anveshak.vision.jobs.WorkerSettings"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anveshak-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_URL
              value: "postgresql://anveshak:$(POSTGRES_PASSWORD)@postgres:5432/anveshak"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: VISION_DEVICE
              value: "cpu"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 6Gi
          livenessProbe:
            exec:
              command: ["python", "-c", "import redis; redis.from_url('redis://redis:6379/0').ping()"]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: models
              mountPath: /app/models
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: vision-media-pvc
        - name: models
          persistentVolumeClaim:
            claimName: vision-models-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vision-media-pvc
  namespace: anveshak
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vision-models-pvc
  namespace: anveshak
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
