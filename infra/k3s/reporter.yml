# Reporter FastAPI container eliminated — CRUD routes absorbed into API gateway.
# Only the ARQ worker remains for LLM report generation + PDF.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  namespace: anveshak
  labels:
    app: report-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-worker
  template:
    metadata:
      labels:
        app: report-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: report-worker
          image: anveshak-reporter:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "arq", "anveshak.reporter.worker.WorkerSettings"]
          ports:
            - containerPort: 8006
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anveshak-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_URL
              value: "postgresql://anveshak:$(POSTGRES_PASSWORD)@postgres:5432/anveshak"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
            - name: ANALYST_SERVICE_URL
              value: "http://analyse-scheduler:8007"
            - name: REPORT_OUTPUT_DIR
              value: "/app/reports"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["python", "-c", "import redis; redis.from_url('redis://redis:6379/0').ping()"]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          volumeMounts:
            - name: reports
              mountPath: /app/reports
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: reporter-output-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reporter-output-pvc
  namespace: anveshak
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
