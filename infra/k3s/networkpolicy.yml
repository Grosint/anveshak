# Default deny all ingress — zero-trust baseline.
# Each service gets explicit allow rules below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: anveshak
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow frontend -> api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-api
  namespace: anveshak
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 8000
---
# Allow services -> postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-postgres
  namespace: anveshak
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: analyse-scheduler
        - podSelector:
            matchLabels:
              app: analyse-worker
        - podSelector:
            matchLabels:
              app: scrape-web-scheduler
        - podSelector:
            matchLabels:
              app: scrape-web-worker
        - podSelector:
            matchLabels:
              app: scrape-social-scheduler
        - podSelector:
            matchLabels:
              app: scrape-social-worker
        - podSelector:
            matchLabels:
              app: report-worker
        - podSelector:
            matchLabels:
              app: analyse-vision-worker
      ports:
        - port: 5432
---
# Allow services -> redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-redis
  namespace: anveshak
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: analyse-scheduler
        - podSelector:
            matchLabels:
              app: analyse-worker
        - podSelector:
            matchLabels:
              app: scrape-web-scheduler
        - podSelector:
            matchLabels:
              app: scrape-web-worker
        - podSelector:
            matchLabels:
              app: scrape-social-scheduler
        - podSelector:
            matchLabels:
              app: scrape-social-worker
        - podSelector:
            matchLabels:
              app: report-worker
        - podSelector:
            matchLabels:
              app: analyse-vision-worker
      ports:
        - port: 6379
---
# Allow services -> ollama
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-ollama
  namespace: anveshak
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: analyse-worker
        - podSelector:
            matchLabels:
              app: report-worker
      ports:
        - port: 11434
---
# Allow ingress controller -> frontend + api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: anveshak
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 3000
---
# Default deny all egress — restrict outbound traffic.
# Services that need external access (social adapters, scraper) get explicit allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: anveshak
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# Allow all pods -> DNS (required for service discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: anveshak
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Allow scraper + social -> external HTTPS (web scraping, social APIs)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-https-egress
  namespace: anveshak
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [scraper, social]
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
---
# Allow scraper -> Tor SOCKS5 proxy (dark web scraping)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scraper-tor-egress
  namespace: anveshak
spec:
  podSelector:
    matchLabels:
      app: scraper
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: tor-proxy
      ports:
        - port: 9050
          protocol: TCP
