# Anveshak — Kubernetes Secrets Template
#
# WARNING: Fill in real values and apply manually. NEVER commit with real secrets.
#
# Apply:
#   kubectl apply -f infra/k3s/secrets-template.yml
#
# For production, use:
#   kubectl create secret generic anveshak-secrets \
#     --from-literal=POSTGRES_PASSWORD=<generated> \
#     --from-literal=API_SECRET_KEY=<generated> \
#     --from-literal=GRAFANA_ADMIN_PASSWORD=<generated> \
#     -n anveshak
apiVersion: v1
kind: Secret
metadata:
  name: anveshak-secrets
  namespace: anveshak
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE-ME"
  API_SECRET_KEY: "CHANGE-ME"
  GRAFANA_ADMIN_PASSWORD: "CHANGE-ME"
  # Social adapters (optional)
  # TELEGRAM_API_ID: ""
  # TELEGRAM_API_HASH: ""
  # TELEGRAM_SESSION_STRING: ""
  # X_BEARER_TOKEN: ""
