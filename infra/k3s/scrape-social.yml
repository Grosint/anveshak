apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrape-social-scheduler
  namespace: anveshak
  labels:
    app: scrape-social-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrape-social-scheduler
  template:
    metadata:
      labels:
        app: scrape-social-scheduler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: scrape-social-scheduler
          image: anveshak-social:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anveshak-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_URL
              value: "postgresql://anveshak:$(POSTGRES_PASSWORD)@postgres:5432/anveshak"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MEDIA_STORAGE_ROOT
              value: "/app/media"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
          volumeMounts:
            - name: media
              mountPath: /app/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: vision-media-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrape-social-worker
  namespace: anveshak
  labels:
    app: scrape-social-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrape-social-worker
  template:
    metadata:
      labels:
        app: scrape-social-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: scrape-social-worker
          image: anveshak-social:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "arq", "anveshak.social.jobs.WorkerSettings"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anveshak-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_URL
              value: "postgresql://anveshak:$(POSTGRES_PASSWORD)@postgres:5432/anveshak"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MEDIA_STORAGE_ROOT
              value: "/app/media"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
          volumeMounts:
            - name: media
              mountPath: /app/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: vision-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: scrape-social-scheduler
  namespace: anveshak
spec:
  selector:
    app: scrape-social-scheduler
  ports:
    - port: 8002
      targetPort: 8002
