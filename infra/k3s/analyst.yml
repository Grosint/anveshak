apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyse-scheduler
  namespace: anveshak
  labels:
    app: analyse-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyse-scheduler
  template:
    metadata:
      labels:
        app: analyse-scheduler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: analyse-scheduler
          image: anveshak-analyst:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "anveshak.analyst.scheduler"]
          ports:
            - containerPort: 8007
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anveshak-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_URL
              value: "postgresql://anveshak:$(POSTGRES_PASSWORD)@postgres:5432/anveshak"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyse-worker
  namespace: anveshak
  labels:
    app: analyse-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyse-worker
  template:
    metadata:
      labels:
        app: analyse-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: analyse-worker
          image: anveshak-analyst:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "arq", "anveshak.analyst.jobs.WorkerSettings"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anveshak-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_URL
              value: "postgresql://anveshak:$(POSTGRES_PASSWORD)@postgres:5432/anveshak"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
            - name: HF_HOME
              value: "/app/models"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: 4Gi
              cpu: 500m
            limits:
              memory: 6Gi
          livenessProbe:
            exec:
              command: ["python", "-c", "import redis; redis.from_url('redis://redis:6379/0').ping()"]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /app/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: analyst-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: analyse-scheduler
  namespace: anveshak
spec:
  selector:
    app: analyse-scheduler
  ports:
    - port: 8007
      targetPort: 8007
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analyst-models-pvc
  namespace: anveshak
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
