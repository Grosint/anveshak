apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: anveshak
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: anveshak-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_URL
              value: "postgresql://anveshak:$(POSTGRES_PASSWORD)@postgres:5432/anveshak"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anveshak-secrets
                  key: POSTGRES_PASSWORD
            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: anveshak-secrets
                  key: API_SECRET_KEY
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: anveshak
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
