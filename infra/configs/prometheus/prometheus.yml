# Anveshak — Prometheus scrape configuration
# Reload without restart: POST http://localhost:9090/-/reload

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    platform: anveshak
    environment: ${ENVIRONMENT:-production}

# Alerting rules (8G)
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers: []
  # - static_configs:
  #     - targets: ["alertmanager:9093"]

scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API Gateway — primary entry point, tracks request rates + latencies
  - job_name: anveshak_api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: api

  # Scraper — web + dark-web collection metrics
  - job_name: anveshak_scraper
    metrics_path: /metrics
    static_configs:
      - targets: ["scraper:8001"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: scraper

  # Social intelligence collector
  - job_name: anveshak_social
    metrics_path: /metrics
    static_configs:
      - targets: ["social:8002"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: social

  # Vision / image-analysis service
  - job_name: anveshak_vision
    metrics_path: /metrics
    static_configs:
      - targets: ["vision:8003"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: vision

  # Analyst — NER, entity resolution, embeddings
  - job_name: anveshak_analyst
    metrics_path: /metrics
    static_configs:
      - targets: ["analyst-scheduler:8007"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: analyst

  # Reporter FastAPI service
  - job_name: anveshak_reporter
    metrics_path: /metrics
    static_configs:
      - targets: ["reporter:8005"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: reporter

  # Reporter ARQ worker — exposes reporter_* and arq_jobs_failed_total metrics
  - job_name: anveshak_reporter_worker
    metrics_path: /metrics
    static_configs:
      - targets: ["reporter-worker:8006"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: reporter-worker

  # Ollama — no native /metrics endpoint; skip scraping
  # Enable if using a metrics-exporting Ollama fork in future

  # PostgreSQL — via postgres_exporter sidecar
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: postgres

  # Redis — via redis_exporter sidecar
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: redis

  # Loki — log ingestion health
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: loki

  # cAdvisor — per-container CPU, memory, network, disk metrics
  - job_name: cadvisor
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: cadvisor
    metric_relabel_configs:
      # Keep only per-container metrics (id="/docker/..."), drop root cgroup aggregates
      - source_labels: [id]
        regex: /docker/.+
        action: keep
      # Extract short container ID as label (first 12 chars) for readability
      - source_labels: [id]
        regex: /docker/(.{12}).*
        target_label: container_short
        replacement: "${1}"
