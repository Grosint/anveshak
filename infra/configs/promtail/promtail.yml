# Anveshak — Promtail log shipping configuration
# Reads Docker container logs via Docker socket and ships them to Loki.
#
# Label strategy (cardinality control):
#   STREAM LABELS (low-cardinality, used for Loki stream selection):
#     job         = "anveshak" (constant)
#     service     = extracted from structlog JSON field "service"
#     level       = extracted from structlog JSON field "level"
#     container   = Docker container name
#   LOG LINE (high-cardinality fields stay in the body, not promoted to labels):
#     event, content_hash, url, topic_id, source_id — kept in log body only

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    # Batch settings optimised for low-throughput sovereign deployment
    batchwait: 1s
    batchsize: 524288  # 512 KiB
    timeout: 10s
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  # ---------------------------------------------------------------------------
  # Docker container log discovery
  # Uses Docker socket (read-only mount) to auto-discover all Compose services.
  # ---------------------------------------------------------------------------
  - job_name: anveshak_docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # Only scrape containers belonging to the Anveshak Compose project
          - name: label
            values: ["com.docker.compose.project"]

    relabel_configs:
      # Container name → container label (strip leading slash)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: container

      # Compose service name → service label
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service

      # Compose project → project label
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project

      # Static job label
      - target_label: job
        replacement: anveshak

      # Drop containers that emit no logs (workers with no stdout)
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: ""
        action: drop

    pipeline_stages:
      # --- Stage 1: parse structlog JSON output ---
      # Attempt JSON parse; if the line is not JSON (e.g. from a non-Anveshak
      # container or a plain-text error from the OS), we still forward the raw
      # line but without extracted labels.
      - json:
          expressions:
            extracted_level: level
            extracted_service: service
            extracted_event: event
            extracted_environment: environment

      # --- Stage 2: promote parsed fields to Loki stream labels ---
      # Only low-cardinality fields are promoted; high-cardinality fields like
      # content_hash, url, topic_id remain in the log body.
      - labels:
          level: extracted_level
          service: extracted_service

      # --- Stage 3: drop DEBUG logs in production to reduce storage ---
      - match:
          selector: '{job="anveshak"}'
          stages:
            - drop:
                expression: '"level":"debug"'
                older_than: 0s

      # --- Stage 4: add static environment label from Docker env ---
      - static_labels:
          platform: anveshak

      # --- Stage 5: set the log timestamp from the structured field ---
      - timestamp:
          source: extracted_event
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
          action_on_failure: skip

      # --- Stage 6: output the full original JSON line as the log body ---
      # This preserves all high-cardinality fields (content_hash, url, etc.)
      # in the body for full-text search in Grafana Explore.
      - output:
          source: message
