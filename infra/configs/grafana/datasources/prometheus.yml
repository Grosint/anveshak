# Grafana datasource provisioning — Prometheus (8B.1)
# Auto-provisioned on container startup — no manual configuration required.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
