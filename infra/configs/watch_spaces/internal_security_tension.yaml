# Internal security tension — Watch Space seed. Issue #25.
#
# A Watch Space is an ordinary Topic with broad keywords and many sources.
# It collects across a domain so that narrative detection has something to
# detect within, rather than tracking a subject an analyst already named.
#
# The keywords below describe a domain. None of them names an organisation,
# a party, or an individual. That constraint is load-bearing rather than
# stylistic: the demonstration claims the system surfaced a narrative
# unaided, and a target hidden in the keywords makes that claim false. The
# first thing a customer will do is read this file.
#
# Enforced by tests/unit/test_watch_space.py.

name: Internal Security Tension
is_watch_space: true
status: active

# Both languages, because a signal drawn only from English discourse
# describes the English-speaking part of a story rather than the story.
languages:
  - en
  - hi

# Broad, so an emerging narrative is not filtered out before clustering.
credibility_min: 20.0
signal_threshold: 3

keywords:
  # Public order vocabulary
  - communal tension
  - communal clash
  - mob violence
  - stone pelting
  - arson attack
  - curfew imposed
  - prohibitory orders
  - internet shutdown
  - lathi charge
  - preventive detention
  - protest march
  - road blockade
  - shutdown call
  - hunger strike
  - police firing
  # Speech and narrative vocabulary
  - inflammatory speech
  - hate speech
  - provocative slogans
  - religious procession
  - forced conversion allegation
  - cow vigilante
  - fake video claim
  - doctored video
  - misinformation campaign
  - rumour spread
  # Hindi domain vocabulary
  - सांप्रदायिक तनाव
  - पथराव
  - कर्फ्यू
  - भड़काऊ भाषण
  - विरोध प्रदर्शन
  - इंटरनेट बंद
  - अफवाह
  - हिंसा भड़की
  - जुलूस विवाद
  - बंद का ऐलान

# Roughly thirty to fifty sources spanning news feeds, video channels,
# forums, public messaging channels and high-reach accounts. Breadth is the
# point: a narrative confined to one platform is amplification, and the
# Manufactured Narrative signal can only see that if the Watch Space is wide
# enough to have missed it elsewhere.
