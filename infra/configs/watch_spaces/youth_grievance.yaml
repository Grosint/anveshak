# Youth grievance - Watch Space seed. Issue #52.
#
# The second Watch Space, standing alongside internal_security_tension.yaml
# rather than replacing or widening it. A narrative that begins as an
# economic or educational grievance and only later produces street
# mobilization is not public-order vocabulary when it starts, so the public
# order Watch Space sees it late or not at all.
#
# The keywords below describe a domain: examination integrity, employment,
# and campus grievance. None of them names an organisation, a party, or an
# individual, which is the same constraint the first Watch Space states. A
# target hidden in the keywords would make the later claim that the system
# found a narrative unaided false, and the keywords are the first thing an
# evaluating officer reads.
#
# Enforced by tests/unit/test_watch_space.py, which runs every constraint
# against every file in this directory.

name: Youth Grievance
is_watch_space: true
status: active

# Aspirant and student discourse is substantially Hindi, more so than public
# order reporting, so an English-only keyword set would read the commentary
# about the grievance rather than the grievance.
languages:
  - en
  - hi

# Broad, so an emerging narrative is not filtered out before clustering.
# Matched to the first Watch Space: these are collection-width settings, not
# a per-domain tuning knob, and issue #52 puts detection thresholds out of
# scope.
credibility_min: 20.0
signal_threshold: 3

keywords:
  # Examination integrity vocabulary
  - paper leak
  - question paper leak
  - exam cancelled
  - exam postponed
  - re-exam demand
  - answer key dispute
  - result delay
  - merit list irregularity
  - recruitment scam
  - recruitment exam irregularity
  - exam malpractice
  - impersonation racket
  - cut-off dispute
  # Employment vocabulary
  - youth unemployment
  - jobless growth
  - vacancy freeze
  - appointment letter pending
  - contract hiring
  - outsourced recruitment
  - job crisis
  - employment exchange
  - retrenchment notice
  - apprentice stipend
  # Campus and aspirant grievance vocabulary
  - student protest
  - campus unrest
  - hostel protest
  - fee hike
  - scholarship delay
  - aspirant protest
  - coaching centre fraud
  - library sit-in
  # Hindi domain vocabulary
  - पेपर लीक
  - परीक्षा रद्द
  - भर्ती घोटाला
  - भर्ती में धांधली
  - बेरोजगारी
  - युवा बेरोजगारी
  - छात्र आंदोलन
  - नौकरी संकट
  - रिजल्ट में देरी
  - नियुक्ति पत्र
  - फीस वृद्धि
  - छात्रवृत्ति में देरी
  - खाली पद
  - रोजगार मेला

# Roughly thirty to fifty sources spanning education and economy feeds,
# video channels, aspirant forums, public messaging channels and high-reach
# accounts. Breadth is the point here too: a grievance confined to one
# platform is amplification rather than a narrative, and the Manufactured
# Narrative signal can only read that if the Watch Space is wide enough to
# have missed it elsewhere.
#
# Sources are global rows. The overlap with the first Watch Space is
# deliberate and costs nothing: the seeder matches on url_or_handle and
# links the existing row rather than duplicating it.
