# Mobilization lexicon — issue #33.
#
# Patterns that indicate public content is calling for people to assemble.
# Versioned as a file rather than embedded in code, because the customer owns
# this vocabulary and will edit it, and because an analyst must be able to
# read what fired a signal.
#
# The signal reports what was publicly said. It never states that an event
# will occur and carries no probability that one will. A cited phrase
# survives scrutiny; a model's impression does not.
#
# Every pattern is a call to assemble. None is a viewpoint, an organisation,
# or a grievance: the signal fires on the act of convening, not on who is
# convening or why.

version: 1
updated: 2026-09-08

patterns:
  # --- English -------------------------------------------------------
  - id: en_gather_at
    language: en
    regex: '\b(?:gather|assemble|converge|congregate)\s+(?:at|on|outside|near|in\s+front\s+of)\b'
  - id: en_join_us
    language: en
    regex: '\b(?:join\s+us|come\s+out|turn\s+out|show\s+up)\s+(?:at|on|tomorrow|today|this)\b'
  - id: en_march
    language: en
    regex: '\b(?:protest|candle)?\s?march\s+(?:to|from|at|on|towards)\b'
  - id: en_all_are_invited
    language: en
    regex: '\ball\s+(?:are|is)\s+(?:invited|requested|welcome)\s+to\s+(?:join|attend|gather|assemble)\b'
  - id: en_reach_by_time
    language: en
    regex: '\b(?:reach|be\s+present|assemble)\s+(?:at|by)\s+\d{1,2}(?::\d{2})?\s*(?:am|pm|baje)\b'
  - id: en_bandh_call
    language: en
    regex: '\b(?:call|calls|calling)\s+for\s+(?:a\s+)?(?:bandh|hartal|strike|shutdown|dharna|gherao)\b'
  - id: en_dharna
    language: en
    regex: '\b(?:dharna|gherao|rasta\s+roko|chakka\s+jam)\b'
  - id: en_mass_gathering
    language: en
    regex: '\b(?:maha)?(?:panchayat|rally|jansabha|sabha)\s+(?:at|on|in)\b'

  # --- Hindi ---------------------------------------------------------
  # Imperative form of "to arrive". Stands alone: the call is the verb, and
  # the place and time usually precede it in Hindi word order.
  - id: hi_pahunche
    language: hi
    regex: 'पहुं?चे[ंन]'
  - id: hi_ekatra
    language: hi
    regex: 'एकत्र\s*(?:हों|होकर|होने)'
  - id: hi_ikattha
    language: hi
    regex: 'इकट्ठा\s*(?:हों|होकर|होने)'
  - id: hi_juloos
    language: hi
    regex: 'जुलूस\s*(?:निकाल|निकलेगा|निकालेंगे)'
  - id: hi_pradarshan
    language: hi
    regex: '(?:विरोध\s*)?प्रदर्शन\s*(?:करने|होगा|करेंगे)'
  - id: hi_bandh_ka_ailan
    language: hi
    regex: 'बंद\s*का\s*(?:ऐलान|आह्वान)'
  - id: hi_dharna
    language: hi
    regex: 'धरना\s*(?:देंगे|दिया\s*जाएगा|प्रदर्शन)'
  # "Everyone come": the subject and the verb are often separated by a time
  # or a place, so they are not required to be adjacent.
  - id: hi_sabhi_aayen
    language: hi
    regex: 'सभी(?:\s+\S+){0,4}\s*(?:आएं|आयें|आइए)'
  - id: hi_maha_panchayat
    language: hi
    regex: 'महापंचायत\s*(?:में|का|होगी)'
  - id: hi_chakka_jam
    language: hi
    regex: 'चक्का\s*जाम|रास्ता\s*रोको'

# Place markers. A match here is only used to locate a candidate place name
# next to the matched phrase; it decides nothing on its own.
place_markers:
  en:
    - 'at'
    - 'outside'
    - 'near'
    - 'in front of'
    - 'towards'
  hi:
    - 'पर'
    - 'के बाहर'
    - 'के पास'
    - 'की ओर'
    - 'में'
