---
# Anveshak — Vision GPU overlay
# Adds NVIDIA GPU device reservation to the vision worker.
# Only needed when VISION_DEVICE=cuda and nvidia-container-toolkit is installed.
#
# Usage (GPU):
#   VISION_DEVICE=cuda docker compose \
#     -f infra/compose.yml \
#     -f infra/compose.vision.yml up
#
# CPU mode: just use compose.yml — vision worker runs on CPU by default.

services:

  analyse-vision-worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
