---
# Anveshak — Vision GPU overlay
# Adds NVIDIA GPU device reservation to the vision services.
# Only needed when VISION_DEVICE=cuda and nvidia-container-toolkit is installed.
#
# Usage (GPU):
#   VISION_DEVICE=cuda docker compose \
#     -f infra/compose.yml \
#     -f infra/compose.vision.yml up
#
# CPU mode: just use compose.yml — vision is included in the core stack.

services:

  vision:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vision-worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
