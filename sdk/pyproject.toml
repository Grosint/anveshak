[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anveshak-sdk"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "structlog>=24.1",
]

[tool.hatch.build]
include = ["anveshak/"]
exclude = ["anveshak/__pycache__/"]

[tool.hatch.build.targets.wheel]
packages = ["anveshak"]
