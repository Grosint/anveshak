[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anveshak-sdk"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "structlog>=24.1",
]

[tool.hatch.build]
# Root .gitignore excludes models/ and media/ (ML weight dirs) which
# also matches our Python packages anveshak/models/ and anveshak/media/.
# Override so hatchling includes them in the wheel.
ignore-vcs = true
include = ["anveshak/"]
exclude = ["anveshak/__pycache__/"]

[tool.hatch.build.targets.wheel]
packages = ["anveshak"]
