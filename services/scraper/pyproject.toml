[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anveshak-scraper"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anveshak-sdk",
    "crawl4ai>=0.4",
    "trafilatura>=1.8",
    "langdetect>=1.0",
    "httpx[socks]>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "arq>=0.25",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "feedparser>=6.0",
    "pymupdf>=1.24",
]
[tool.hatch.build.targets.wheel]
packages = ["anveshak"]
[tool.uv.sources]
anveshak-sdk = { workspace = true }
