[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anveshak-social"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "anveshak-sdk",
    "telethon>=1.35",
    "praw>=7.7",
    "atproto>=0.0.46",
    "tweepy>=4.14",
    "instagrapi>=2.1",
    "aiohttp>=3.9",
    "async_lru>=2.0",
    "oauthlib>=3.2",
    "asyncpg>=0.29",
    "redis>=5.0",
    "arq>=0.25",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "langdetect>=1.0",
    "trafilatura>=1.8",
]
[tool.hatch.build.targets.wheel]
packages = ["anveshak"]
[tool.uv.sources]
anveshak-sdk = { workspace = true }
