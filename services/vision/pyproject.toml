[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anveshak-vision"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "anveshak-sdk",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "arq>=0.25",
    # ML — hardware-controlled via settings.py (see hardware.md)
    "ultralytics>=8.1",          # YOLOv8 — model size from YOLO_MODEL_SIZE env
    "transformers>=4.40",        # CLIP — model from CLIP_MODEL_NAME env
    "onnxruntime>=1.17",         # CPU inference; swap to onnxruntime-gpu on CUDA machine
    "torch>=2.2",                # required by ultralytics + transformers
    "scipy>=1.13",               # softmax for FacetorchDetector
    # Media processing
    "Pillow>=10.3",              # EXIF extraction + image preprocessing
    "imagehash>=4.3",            # pHash for near-duplicate detection (criteria 4.6)
    "opencv-python-headless>=4.9",  # face detection (Haar cascade), frame preprocessing
    # DB + infrastructure
    "asyncpg>=0.29",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["anveshak"]

[tool.uv.sources]
anveshak-sdk = { workspace = true }
