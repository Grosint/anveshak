[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anveshak-reporter"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "anveshak-sdk",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
    "weasyprint>=61.0",
    "staticmap>=0.5",
    "asyncpg>=0.29",
    "redis>=5.0",
    "arq>=0.25",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "geonamescache>=1.7",
    "croniter>=2.0",
]
[tool.hatch.build.targets.wheel]
packages = ["anveshak"]
[tool.uv.sources]
anveshak-sdk = { workspace = true }
