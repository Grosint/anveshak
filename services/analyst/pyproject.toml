[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anveshak-analyst"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "anveshak-sdk",
    "spacy>=3.7",
    "langdetect>=1.0",
    "sentence-transformers>=2.7,<4.0",
    "transformers>=4.41,<5.0",
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
    "hdbscan>=0.8",
    "datasketch>=1.6",
    "numpy>=1.26",
    "asyncpg>=0.29",
    "redis>=5.0",
    "arq>=0.25",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "vaderSentiment>=3.3",
    "yake>=0.4",
]
[tool.hatch.build.targets.wheel]
packages = ["anveshak"]
[tool.uv.sources]
anveshak-sdk = { workspace = true }
