  # --- deliberately wrong language labels (issue #56) ------------------
  # The `language` on every row above is hand-written and correct, so the
  # numbers they produce describe detection given a correct label and say
  # nothing about the label itself. A real detector labels Latin-script
  # Hinglish `hi` routinely, and that is the content the transliterated
  # patterns were written for.
  #
  # The label on each row below contradicts the script its text is written
  # in. They are scored like any other row, so a return to selecting
  # patterns by label shows up as lost recall here rather than nowhere.
  - text: "Dilli Chalo on March 18. Buses leave at dawn."
    language: hi
    is_call_to_assemble: true
    expected_date: "2026-03-18"
    expected_place: null
  - text: "Jail bharo from March 20. Volunteers will court arrest at the district jail."
    language: hi
    is_call_to_assemble: true
    expected_date: "2026-03-20"
    expected_place: null
  - text: "Bengaluru kooch karenge, sab taiyar rahein."
    language: hi
    is_call_to_assemble: true
    expected_date: null
    expected_place: null
  - text: "कल जुलूस निकालेंगे। सभी शामिल हों।"
