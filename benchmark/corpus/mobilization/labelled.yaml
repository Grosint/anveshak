# Mobilization labelled set — issue #34.
#
# provenance: synthetic
#
# These are worked examples that exercise the harness. They are NOT the
# labelled set the acceptance bars are measured on. That set is 100 to 200
# examples drawn from public reporting of past events, and assembling it is
# human work: examples invented by a model would measure the model against
# its own priors. See README.md in this directory.

provenance: synthetic
version: 0
examples:
  # --- positives, English ---------------------------------------------
  - text: "All are invited to join the gathering outside the collectorate on March 12 at 4pm."
    language: en
    is_call_to_assemble: true
    expected_date: "2026-03-12"
    expected_place: "the collectorate"
  - text: "Everyone gather at Town Square tomorrow evening. Bring your families."
    language: en
    is_call_to_assemble: true
    expected_date: null
    expected_place: "Town Square"
  - text: "Protest march to the district headquarters on March 15."
    language: en
    is_call_to_assemble: true
    expected_date: "2026-03-15"
    expected_place: null

  # --- positives, Hindi -----------------------------------------------
  - text: "सभी लोग कल सुबह कलेक्ट्रेट पर पहुंचें।"
