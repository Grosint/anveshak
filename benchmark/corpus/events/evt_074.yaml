id: "evt-074"
name: "Smart City Infrastructure — Pune IoT Attack"
category: "critical_infrastructure"
languages: ["en"]
earliest_osint_signal: "2024-07-09T03:00:00Z"
mainstream_media_date: "2024-07-09T12:00:00Z"
description: >
  Attackers compromised Pune Smart City's IoT infrastructure, taking control of over
  2,000 smart streetlights and 150 traffic signal controllers through an exposed MQTT
  broker. The attack caused citywide traffic signal malfunctions during morning rush hour,
  resulting in multiple accidents. Pune Municipal Corporation disconnected all smart
  infrastructure pending a full security audit.
