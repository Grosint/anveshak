description: >
  Suspected militants sabotaged an Oil India Limited crude oil pipeline in Tinsukia
  district, Assam, causing a major spill affecting 12 hectares of wetland. The attack
  used improvised explosive devices placed at two valve stations along the Duliajan-Numaligarh
  corridor. ULFA-I claimed responsibility through a Telegram channel.
