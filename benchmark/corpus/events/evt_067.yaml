id: "evt-067"
name: "Indian Banking System — UPI Payment Gateway DDoS"
category: "critical_infrastructure"
languages: ["en", "hi"]
earliest_osint_signal: "2024-01-15T01:30:00Z"
mainstream_media_date: "2024-01-15T10:00:00Z"
description: >
  A massive distributed denial-of-service attack targeted NPCI's UPI payment gateway
  infrastructure, causing transaction failures across major banks including SBI, HDFC,
  and ICICI during peak morning hours. The attack sustained 3.2 Tbps of traffic from
  a botnet traced to Eastern European IP ranges. RBI activated its cyber crisis
  management plan.
