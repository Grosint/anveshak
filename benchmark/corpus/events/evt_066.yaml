id: "evt-066"
name: "ISRO Chandrayaan Data Centre Cyber Attack Attempt"
category: "critical_infrastructure"
languages: ["en", "hi"]
earliest_osint_signal: "2023-08-25T02:00:00Z"
mainstream_media_date: "2023-08-25T11:00:00Z"
description: >
  A sophisticated cyber attack targeted ISRO's telemetry data centre in Bengaluru
  days after Chandrayaan-3's successful lunar landing. The attack involved spear-phishing
  emails impersonating ISRO officials and attempted lateral movement toward mission
  control systems. CERT-In issued an emergency advisory to all space sector entities.
keywords: ["ISRO", "Chandrayaan", "cyber attack", "data centre", "CERT-In", "spear phishing", "Bengaluru"]
