description: >
  Reports emerged that the Maldives signed a military cooperation
  agreement with China, including provisions for joint exercises and
  a Chinese-funded coast guard facility on Marao atoll. The deal
  followed the India Out campaign and replacement of Indian military
  personnel with Chinese technical advisors. Indian strategic community
  raised concerns about encirclement in the Indian Ocean.
