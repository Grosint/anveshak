description: >
  Security researchers disclosed a critical vulnerability in Indian Railways' Electronic
  Interlocking signaling systems deployed across 4,500 stations. The flaw in the KAVACH
  integration layer could allow unauthorized signal manipulation via unencrypted serial
  communication channels. Railway Board initiated emergency patching of all Class A routes.
