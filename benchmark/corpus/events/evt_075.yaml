id: "evt-075"
name: "Indian Power Grid — North Eastern Grid Instability"
category: "critical_infrastructure"
languages: ["en", "hi"]
earliest_osint_signal: "2024-08-18T01:00:00Z"
mainstream_media_date: "2024-08-18T11:00:00Z"
description: >
  A coordinated cyber-physical attack caused severe frequency deviations in India's
  North Eastern Regional Grid, triggering cascading load-shedding across Assam, Meghalaya,
  and Tripura. Investigators found malware in the SCADA systems of two substations near
  Bongaigaon that manipulated relay protection settings. POSOCO activated emergency
  islanding protocols to prevent grid collapse.
