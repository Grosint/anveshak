earliest_osint_signal: "2024-05-11T01:00:00Z"
mainstream_media_date: "2024-05-11T13:00:00Z"
description: >
  A state-sponsored APT group attempted to breach DRDO's internal research network
  through a supply chain attack targeting a third-party IT vendor. The attackers deployed
  custom malware disguised as a software update for laboratory management systems.
  NIA launched an investigation after initial forensic analysis pointed to a South Asian
  threat actor with nation-state backing.
