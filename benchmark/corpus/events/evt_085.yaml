description: >
  A sophisticated PLC-targeting malware was discovered in ICS networks of an
  Indian chemical plant. The malware shared code similarities with Stuxnet-era
  payloads and targeted Siemens S7 controllers. Threat intel forums and
  industrial security researchers identified the malware samples before CERT-In advisory.
