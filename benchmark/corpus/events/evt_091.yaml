description: >
  India's Northern Command conducted a pre-scheduled annual winter exercise
  (Himgiri Prahar) near the LAC. OSINT watchers misidentified routine troop
  rotations and logistics movements as a mobilisation buildup, amplifying
  alarm across social media. The exercise was publicly gazetted weeks prior.
