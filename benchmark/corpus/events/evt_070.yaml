id: "evt-070"
name: "Nuclear Power Corporation Kudankulam Cyber Probe"
category: "critical_infrastructure"
languages: ["en"]
earliest_osint_signal: "2023-11-14T01:00:00Z"
mainstream_media_date: "2023-11-14T12:00:00Z"
description: >
  A persistent cyber intrusion was detected in the administrative network of Kudankulam
  Nuclear Power Plant in Tamil Nadu. The malware, attributed to a Lazarus Group variant,
  targeted the plant's HR and procurement systems. NPCIL confirmed operational technology
  networks remained air-gapped and unaffected. DAE ordered a comprehensive security audit
  across all nuclear installations.
