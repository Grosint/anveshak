id: "evt-072"
name: "Port of Mumbai — Cyber Intrusion Detection"
category: "critical_infrastructure"
languages: ["en"]
earliest_osint_signal: "2024-03-28T02:00:00Z"
mainstream_media_date: "2024-03-28T12:00:00Z"
description: >
  Mumbai Port Trust detected unauthorized access to its vessel traffic management system
  and cargo scheduling database. The intrusion exploited a zero-day vulnerability in the
  port's legacy SCADA interface. Maritime traffic was temporarily rerouted to JNPT while
  incident response teams isolated affected systems. NCIIPC issued a critical alert to
  all major Indian ports.
keywords: ["Mumbai Port", "cyber intrusion", "SCADA", "vessel traffic", "NCIIPC", "JNPT", "maritime", "zero-day"]
