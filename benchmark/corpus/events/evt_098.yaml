mainstream_media_date: "2024-10-06T08:00:00Z"
description: >
  Multiple Indian diplomatic missions in Europe experienced coordinated
  spear-phishing attacks attributed to APT28 (Fancy Bear). The campaign
  used weaponised PDF documents mimicking MEA circulars. CERT-In issued
  an advisory after forensic analysis confirmed GRU-linked infrastructure.
  Exfiltrated data included diplomatic cables and visa processing records.
