description: >
  A threat actor known as "kiberphant0m" claimed to have exfiltrated 278 GB of data
  from BSNL servers, including IMSI numbers, SIM card details, and HLR data affecting
  millions of subscribers. The stolen data was listed on a dark web forum. DoT issued
  emergency directives to BSNL for containment and subscriber notification.
