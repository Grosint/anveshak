<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    ANVESHAK FAVICON
    ────────────────
    Optimised for 16×16 → 64×64 display sizes.
    Strokes are slightly heavier than the full icon for small-size legibility.
    White rounded background ensures visibility on all browser tab colours.
  -->

  <!-- Rounded dark background -->
  <rect width="100" height="100" rx="16" ry="16" fill="#1E2533"/>

  <!-- Horizontal accent line -->
  <line x1="0" y1="12" x2="100" y2="12"
        stroke="#F5A623" stroke-width="3.2" stroke-linecap="square"/>

  <!-- Outer orbit ring -->
  <circle cx="50" cy="55" r="43" stroke="#C47A0B" stroke-width="2.5" fill="none"/>

  <!-- Inner focus ring -->
  <circle cx="50" cy="55" r="29" stroke="#F5A623" stroke-width="2.5" fill="none"/>

  <!-- Upward triangle -->
  <polygon points="50,30 28,67 72,67"
           fill="#2A3347" stroke="#F5A623" stroke-width="2" stroke-linejoin="miter"/>

  <!-- Centre focal dot (slightly larger for favicon legibility) -->
  <circle cx="50" cy="55" r="5.5" fill="#F5A623"/>

  <!-- Cardinal orbital markers -->
  <circle cx="93" cy="55" r="3.5" fill="#D4956A"/>
  <circle cx="50" cy="98" r="3.5" fill="#D4956A"/>
  <circle cx="7"  cy="55" r="3.5" fill="#D4956A"/>
  <circle cx="50" cy="12" r="3.5" fill="#D4956A"/>
</svg>
