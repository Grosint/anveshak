[tool.uv.workspace]
members = [
    "sdk",
    "services/api",
    "services/scraper",
    "services/social",
    "services/vision",
    "services/analyst",
    "services/reporter",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "respx>=0.21",
    "black>=24.0",
    "ruff>=0.3",
    "isort>=5.13",
    "bandit>=1.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: no external dependencies",
    "integration: requires docker compose services",
    "e2e: full demo arc, requires seeded data",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.black]
line-length = 100
target-version = ["py312"]
